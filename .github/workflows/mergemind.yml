name: MergeMind AutoML Conflict Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  mergemind-check:
    name: Analyze merge conflicts
    runs-on: ubuntu-latest

    steps:
      - name: Check out AutoML repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MergeMind
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/SaaranshJohri/Autonomous-Multi-Agent-Merge-Auditor-Execution-Sequence-Verifier.git"

      - name: Fetch pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eux

          echo "Target branch: $BASE_BRANCH"
          echo "Pull request head SHA: $HEAD_SHA"

          git fetch origin \
            "+refs/heads/${BASE_BRANCH}:refs/remotes/origin/${BASE_BRANCH}"

          git fetch origin "$HEAD_SHA"

          git cat-file -e "origin/${BASE_BRANCH}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          echo "Base commit:"
          git log -1 --oneline "origin/${BASE_BRANCH}"

          echo "Head commit:"
          git log -1 --oneline "$HEAD_SHA"

          echo "Changed files:"
          git diff --name-status "origin/${BASE_BRANCH}...${HEAD_SHA}"

      - name: Analyze pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eux

          echo "Running MergeMind pull request analysis"
          echo "Base: origin/${BASE_BRANCH}"
          echo "Head: ${HEAD_SHA}"

          mergemind check \
            --base "origin/${BASE_BRANCH}" \
            --head "${HEAD_SHA}" \
            --fail-on-conflict

      - name: Fetch main branch for manual analysis
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eux
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main"

          git cat-file -e "origin/main^{commit}"

      - name: Analyze main branch manually
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eux

          echo "Running MergeMind manual analysis"
          echo "Base: origin/main"
          echo "Head: HEAD"

          mergemind check \
            --base origin/main \
            --head HEAD \
            --fail-on-conflict
